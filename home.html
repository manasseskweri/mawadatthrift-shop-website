<!DOCTYPE html>
<html>
    <head>
        <style>
            body{
                 font-family:Arial, sans-serif ;
                 margin: 0;
                 background-color: #f8f8f8;
                 color: #333;
            }
            header{
                background-color: #222;
                color: white;
                padding: 20px 40px;
                text-align: center;
            }
            nav{
                background-color: #444;
                display: flex;
                justify-content: center;
                gap: 20px;
                padding: 10px 0;
            }
            nav a{
                color: white;
                text-decoration: none;
                font-weight:bold;
                padding: 8px 15px;
                border-radius: 4px;
                transition:background-color 0.3s ease;
        
            }
            mav a:hover{
                background: #666;

            }
            main{
                max-width: 1200px;
                margin: 300px auto;
                padding: 0 2px;
            }
            hi{
                margin-bottom: 10px;
            }
            .product-grid{
                display: grid;
                grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
                gap: 25px;
            }
            .product-card{
                background-color: white;
                border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                overflow: hidden;
                display: flex;
                flex-direction: column;
                transition: transform 0,2s ease;

            }
            .product-card:hover{
                transform: translateY(-5px);

            }
            .product-image{
                width: 100px;
                height: 200px;
                object-fit: cover;

            }
           .product-info{
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space;
           }

           .product-name{
            font-size: 1.2em;
            margin: 0 0 10px 0;
           }
           .product-price{
            font-weight: bold;
            color: #e63946;
            margin-bottom: 15px;
           }
           .buy-butttom{
            background-color: #1d3557;
            color: white;
            border: none;
            padding: 100px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease;
           }
           .buy-buttom:hover{
            background-color: #457b9d;
           }
           footer{
            background-color: #222;
            color: whitesmoke;
            text-align: center;
            padding: 15px 0;
            margin-top: 40px;
           }
        </style>

    </head>
